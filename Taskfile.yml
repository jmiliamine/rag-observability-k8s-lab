# Task runner of the lab (https://taskfile.dev). The same commands run on Windows, macOS and
# Linux, and a CI job would call them too.
#
#   task doctor              check tools, Docker memory, ports, Ollama
#   task setup               Python 3.14 + dependencies (uv)
#   task test                unit + integration tests, offline
#   task up                  cluster, platform, app, index
#   task up OVERLAY=fake     same, without Ollama or a GPU
#   task stop / task start   pause the cluster and give the RAM back (state is kept)
#   task --list              everything else
version: "3"

vars:
  CLUSTER: obslab
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  REGISTRY_PUSH: localhost:5001               # how the host reaches the k3d registry
  IMAGE: obslab
  APP_DIR: deploy/k8s/app
  OVERLAY: '{{.OVERLAY | default "local"}}'   # local (Ollama) | fake (no model needed)
  DATALAKE: '{{.DATALAKE | default "datalake"}}'  # the data lake: folder of .md/.txt notes to index
  VALUES: deploy/k8s/platform/values
  # Chart versions are pinned: upgrading a platform component is a reviewed one-line change.
  KPS_VERSION: 91.5.1        # prometheus-community/kube-prometheus-stack (operator v0.94)
  LOKI_VERSION: 18.13.5      # grafana-community/loki (Loki 3.7)
  TEMPO_VERSION: 3.0.0       # grafana-community/tempo (Tempo 3.0)
  OTEL_VERSION: 0.173.1      # open-telemetry/opentelemetry-collector (collector 0.160)
  # Scanners run from images pinned by digest, so a scan today and in a year use the same tool.
  TRIVY: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ZIZMOR: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
  ACTIONLINT: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ── Setup and local checks ──────────────────────────────────────────────────
  doctor:
    desc: Check tools, Docker memory, free ports, Ollama and the kubectl/server skew
    cmds: ['uv run --no-project python scripts/doctor.py']

  setup:
    desc: Install Python 3.14 and the dependencies into .venv (uv)
    cmds: ['uv sync']

  test:
    desc: Unit + integration tests (fake models, in-memory exporters, no outbound network)
    cmds: ['{{.PY}} -m pytest -q --allow-hosts=127.0.0.1,::1']

  lint:
    desc: Ruff, generated files up to date, every Kustomize overlay renders
    cmds:
      - '{{.PY}} -m ruff check .'
      - '{{.PY}} scripts/gen_observability.py --check'
      - kubectl kustomize {{.APP_DIR}}/overlays/local > /dev/null
      - kubectl kustomize {{.APP_DIR}}/overlays/fake > /dev/null

  # ── Security scans (Docker only; each one fails on a finding) ───────────────
  scan:
    desc: All security scans (workflows, secrets, dependencies, manifests, image)
    cmds:
      - task: scan:workflows
      - task: scan:secrets
      - task: scan:deps
      - task: scan:config
      - task: scan:image

  scan:workflows:
    desc: Lint the GitHub Actions workflows (actionlint) and audit them (zizmor)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -w /repo {{.ACTIONLINT}} -color=false
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -w /repo {{.ZIZMOR}} --no-progress --offline .github/workflows

  scan:secrets:
    desc: Look for secrets in every commit (gitleaks)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" {{.GITLEAKS}} git /repo --redact --no-banner --exit-code 1

  scan:deps:
    desc: Known vulnerabilities in the locked Python dependencies (Trivy on uv.lock)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -v obslab-trivy-cache:/root/.cache {{.TRIVY}} fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --quiet /repo/uv.lock

  scan:config:
    desc: Misconfigurations in the Dockerfile, Compose file and rendered Kubernetes manifests (Trivy)
    cmds:
      # Scan what is deployed: the overlays rendered by Kustomize, not the base with its placeholders.
      - '{{.PY}} -c "import pathlib; pathlib.Path(''build/k8s'').mkdir(parents=True, exist_ok=True)"'
      - kubectl kustomize {{.APP_DIR}}/overlays/local > build/k8s/app-local.yaml
      - kubectl kustomize {{.APP_DIR}}/overlays/fake > build/k8s/app-fake.yaml
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -v obslab-trivy-cache:/root/.cache {{.TRIVY}} config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --quiet --ignorefile /repo/.trivyignore.yaml --skip-dirs .venv --skip-dirs {{.APP_DIR}} --skip-dirs build/corpus /repo

  scan:image:
    desc: Build the app image and scan it for fixable HIGH and CRITICAL vulnerabilities (Trivy)
    cmds:
      - docker build -q -t {{.IMAGE}}:scan .
      # The image carries code only: the notes stay in the data lake.
      - docker run --rm --entrypoint sh {{.IMAGE}}:scan -c 'test -z "$(ls -A /app)" || { echo "unexpected files in /app:"; ls -A /app; exit 1; }'
      # Scanned from a tarball: no need to hand the Docker socket to the scanner.
      - '{{.PY}} -c "import os; os.makedirs(''build'', exist_ok=True)"'
      - docker save {{.IMAGE}}:scan -o build/image-scan.tar
      - docker run --rm -v "{{.ROOT_DIR}}/build:/build:ro" -v obslab-trivy-cache:/root/.cache {{.TRIVY}} image --input /build/image-scan.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet

  gen:
    desc: Regenerate the dashboard and the PrometheusRule from deploy/shared (compose and k8s)
    cmds: ['{{.PY}} scripts/gen_observability.py']

  # ── Compose: the backends the tests need, app on the host ───────────────────
  stack:up:
    desc: Start the test backends with docker compose (collector, Prometheus, Tempo, Loki, PostgreSQL)
    cmds: ['docker compose -f deploy/compose/docker-compose.yml up -d --wait']

  stack:down:
    desc: Stop the compose stack (volumes are kept)
    cmds: ['docker compose -f deploy/compose/docker-compose.yml down']

  stack:ingest:
    desc: Index the data lake (DATALAKE=folder) into the compose PostgreSQL with the writer role
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: obslab
      PGUSER: obslab_writer
      PGPASSWORD: '{{.OBSLAB_WRITER_PASSWORD | default "writer-local"}}'
      OBSLAB_PROVIDER: '{{.PROVIDER | default "ollama"}}'
    cmds: ['{{.PY}} -m obslab ingest --source "{{.DATALAKE}}"']

  # ── Cluster lifecycle ───────────────────────────────────────────────────────
  cluster:up:
    desc: Create the k3d cluster (1 server + 1 agent + registry), with DATALAKE mounted read-only in the nodes
    status: ['k3d cluster list {{.CLUSTER}}']        # idempotent: skip if it exists
    env:
      OBSLAB_DATALAKE:                               # absolute path, read by deploy/k8s/k3d.yaml
        sh: '{{.PY}} scripts/datalake_path.py "{{.DATALAKE}}"'
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml down 2>/dev/null || true   # frees :4318
      - k3d cluster create --config deploy/k8s/k3d.yaml
      # Gateway API CRDs are NOT installed here: k3s's traefik-crd chart ships the version Traefik
      # supports and refuses CRDs it does not own.
      - kubectl apply -f deploy/k8s/platform/traefik-gateway.yaml
      # k3s installs Traefik asynchronously, in two Jobs. Only the first one is awaited here: it
      # brings the Gateway API CRDs that the next steps apply. Traefik itself starts in the
      # background and is checked by `platform:wait`. The Job is created a few seconds after the
      # cluster starts: `--for=create` waits for it to exist (kubectl >= 1.31), otherwise `wait`
      # fails at once with NotFound.
      - kubectl -n kube-system wait --for=create --for=condition=complete job/helm-install-traefik-crd --timeout=300s

  stop:
    desc: Stop the cluster containers (frees ~4 GB RAM, keeps all data)
    cmds: ['k3d cluster stop {{.CLUSTER}}']

  start:
    desc: Restart a stopped cluster
    cmds: ['k3d cluster start {{.CLUSTER}}']

  cluster:down:
    desc: Delete the cluster, its volumes and the registry (irreversible)
    prompt: This deletes the cluster and all its data. Continue?
    cmds: ['k3d cluster delete {{.CLUSTER}}']

  # ── Platform (what a platform team owns) ────────────────────────────────────
  platform:up:
    desc: Install monitoring (kube-prometheus-stack) and observability (collector, Tempo, Loki), without waiting for the pods
    cmds:
      - kubectl apply -f deploy/k8s/platform/namespaces.yaml
      - task: grafana:secret
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - helm repo add grafana-community https://grafana-community.github.io/helm-charts --force-update
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
      - helm repo update
      # No --wait: the four releases are submitted one after the other and their images are
      # pulled at the same time, while `task up` goes on with the app. `platform:wait` checks
      # that everything is Ready. The charts' CRDs are installed before Helm returns, so the
      # next chart can already use them.
      - helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version {{.KPS_VERSION}} -n monitoring -f {{.VALUES}}/kube-prometheus-stack.yaml
      - helm upgrade --install loki grafana-community/loki --version {{.LOKI_VERSION}} -n observability -f {{.VALUES}}/loki.yaml
      - helm upgrade --install tempo grafana-community/tempo --version {{.TEMPO_VERSION}} -n observability -f {{.VALUES}}/tempo.yaml
      - helm upgrade --install otel-collector open-telemetry/opentelemetry-collector --version {{.OTEL_VERSION}} -n observability -f {{.VALUES}}/otel-collector.yaml
      # The PrometheusRule goes through the operator's admission webhook: wait for the operator
      # (a small image, about a minute), not for the whole stack.
      - kubectl -n monitoring rollout status deploy/kube-prometheus-stack-operator --timeout=10m
      - kubectl apply -f deploy/k8s/platform/generated/
      - kubectl apply -f deploy/k8s/platform/gateway.yaml

  platform:wait:
    desc: Wait until every platform component is Ready (Traefik, Prometheus, Grafana, Loki, Tempo, collector)
    cmds:
      - kubectl -n kube-system wait --for=condition=complete job/helm-install-traefik --timeout=10m
      - kubectl -n kube-system rollout status deploy/traefik --timeout=5m
      - kubectl -n observability rollout status deploy/otel-collector --timeout=10m
      - kubectl -n observability rollout status statefulset/tempo --timeout=10m
      - kubectl -n observability rollout status statefulset/loki --timeout=10m
      # The Prometheus StatefulSet is created by the operator, a moment after the release.
      - kubectl -n monitoring wait --for=create statefulset/prometheus-kube-prometheus-stack-prometheus --timeout=5m
      - kubectl -n monitoring rollout status statefulset/prometheus-kube-prometheus-stack-prometheus --timeout=15m
      - kubectl -n monitoring rollout status deploy/kube-prometheus-stack-grafana --timeout=20m

  grafana:secret:
    internal: true
    silent: true      # never echo the command: it contains the generated password
    status: ['kubectl -n monitoring get secret grafana-admin']   # created once, never rotated silently
    cmds:
      - kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-user=admin --from-literal=admin-password={{.PASSWORD}}
    vars:
      PASSWORD:
        sh: '{{.PY}} -c "import secrets; print(secrets.token_urlsafe(18))"'

  grafana:password:
    desc: Print the Grafana admin password (user admin, http://grafana.localhost:8080)
    cmds:
      - kubectl -n monitoring get secret grafana-admin -o jsonpath="{.data.admin-password}" | {{.PY}} -c "import base64,sys; print(base64.b64decode(sys.stdin.read()).decode())"

  # ── Application (what an app team owns) ─────────────────────────────────────
  db:secret:
    internal: true
    silent: true      # never echo the command: it contains the generated passwords
    status: ['kubectl -n obslab get secret obslab-db']       # created once, never rotated silently
    cmds:
      - kubectl apply -f {{.APP_DIR}}/base/namespace.yaml
      - kubectl -n obslab create secret generic obslab-db --from-literal=admin-password={{.ADMIN}} --from-literal=writer-password={{.WRITER}} --from-literal=reader-password={{.READER}} --from-literal=chat-password={{.CHAT}}
    vars:
      CHAT: {sh: '{{.PY}} -c "import secrets; print(secrets.token_urlsafe(24))"'}
      ADMIN: {sh: '{{.PY}} -c "import secrets; print(secrets.token_urlsafe(24))"'}
      WRITER: {sh: '{{.PY}} -c "import secrets; print(secrets.token_urlsafe(24))"'}
      READER: {sh: '{{.PY}} -c "import secrets; print(secrets.token_urlsafe(24))"'}

  app:build:
    desc: Build the image (code only), tag it (git SHA or timestamp), push it to the k3d registry
    cmds:
      - docker build --build-arg VCS_REF={{.TAG}} -t {{.REGISTRY_PUSH}}/{{.IMAGE}}:{{.TAG}} .
      - docker push {{.REGISTRY_PUSH}}/{{.IMAGE}}:{{.TAG}}
      - '{{.PY}} scripts/set_image_tag.py {{.OVERLAY}} {{.TAG}}'
    vars:
      TAG:
        sh: git rev-parse --short HEAD 2>/dev/null || {{.PY}} -c "import time; print(time.strftime('%Y%m%d-%H%M%S'))"

  app:deploy:
    desc: Apply the last built overlay and wait for the rollout
    cmds:
      - kubectl apply -k {{.APP_DIR}}/overlays/_build
      - kubectl -n obslab rollout status deploy/obslab-api --timeout=15m

  app:ingest:
    desc: Index the data lake now (one-off Job from the suspended CronJob); run it again after changing notes
    vars:
      JOB:
        sh: '{{.PY}} -c "import time; print(time.strftime(''obslab-ingest-%Y%m%d%H%M%S''))"'
    cmds:
      - kubectl -n obslab create job {{.JOB}} --from=cronjob/obslab-ingest
      - kubectl -n obslab wait --for=condition=complete job/{{.JOB}} --timeout=20m
      - kubectl -n obslab logs job/{{.JOB}} --tail=5

  app:
    desc: Build, apply, index and roll out the app (OVERLAY=local|fake)
    cmds:
      - task: app:build
      - task: db:secret
      - kubectl apply -k {{.APP_DIR}}/overlays/_build       # database + CronJob the ingest needs
      # Generous: its image is pulled while the nodes are still pulling the platform images.
      - kubectl -n obslab rollout status statefulset/postgres --timeout=15m
      - task: app:ingest
      - task: app:deploy

  up:
    desc: Whole lab from zero (cluster, platform, app, index)
    cmds:
      # One thing at a time for the Docker engine: building the image while k3d creates its
      # nodes makes node creation time out on a small machine. The platform, on the other
      # hand, starts inside the cluster while the image is built.
      - task: cluster:up
      - task: platform:up        # submitted, not awaited
      - task: app
      - task: platform:wait

  ask:
    desc: 'Ask the deployed RAG one question (Q="How do taints and tolerations work?")'
    requires: {vars: [Q]}
    cmds: ['{{.PY}} -m obslab ask "{{.Q}}" --url http://127.0.0.1:8080 --host-header rag.localhost:8080']

  chat:
    desc: Talk to the deployed RAG, several questions in one conversation
    interactive: true
    cmds: ['{{.PY}} -m obslab chat --url http://127.0.0.1:8080 --host-header rag.localhost:8080']

  load:
    desc: Send traffic to the deployed RAG to feed the dashboards (N=30; CONCURRENCY=12 sends a burst)
    cmds: ['{{.PY}} -m obslab load --url http://127.0.0.1:8080 --host-header rag.localhost:8080 --n {{.N | default 30}} --concurrency {{.CONCURRENCY | default 1}}']

  # ── End-to-end checks against running infrastructure ────────────────────────
  test:stack:
    desc: "Telemetry of a question asked in-process reaches Prometheus, Tempo and Loki (TARGET=k8s|compose, PROVIDER=fake|ollama)"
    vars:
      TARGET: '{{.TARGET | default "k8s"}}'
    env:
      OBSLAB_REQUIRE_STACK: "1"       # an unreachable stack fails the run instead of skipping it
      OBSLAB_PROVIDER: '{{.PROVIDER | default "fake"}}'
      PROM_URL: '{{if eq .TARGET "compose"}}http://localhost:9090{{else}}http://prometheus.localhost:8080{{end}}'
      TEMPO_URL: '{{if eq .TARGET "compose"}}http://localhost:3200{{else}}http://tempo.localhost:8080{{end}}'
      LOKI_URL: '{{if eq .TARGET "compose"}}http://localhost:3100{{else}}http://loki.localhost:8080{{end}}'
    cmds: ['{{.PY}} -m pytest -m stack -q -rs']

  test:compose:
    desc: "Compose end to end: start the stack, index the sample notes into PostgreSQL, check one question's metrics, trace and logs (PROVIDER=fake|ollama)"
    cmds:
      - task: stack:up
      - task: stack:ingest
        vars: {PROVIDER: '{{.PROVIDER | default "fake"}}', DATALAKE: datalake}
      - task: test:compose:run

  test:compose:run:
    internal: true
    env:
      OBSLAB_REQUIRE_STACK: "1"
      OBSLAB_PROVIDER: '{{.PROVIDER | default "fake"}}'
      OBSLAB_STACK_STORE: pgvector      # read the index just built, with the read-only role
      PGHOST: 127.0.0.1
      PGDATABASE: obslab
      PGUSER: obslab_reader
      PGPASSWORD: '{{.OBSLAB_READER_PASSWORD | default "reader-local"}}'
      OBSLAB_CHAT_PASSWORD: '{{.OBSLAB_CHAT_PASSWORD | default "chat-local"}}'
    cmds: ['{{.PY}} -m pytest -m stack -q -rs']

  test:k8s:
    desc: End to end through the Gateway, with pod identity and SLO rules checked
    env:
      OBSLAB_REQUIRE_STACK: "1"
    cmds: ['{{.PY}} -m pytest -m k8s -q -rs']

  test:pgvector:
    desc: The pgvector store, the data lake and the conversations against a real PostgreSQL (starts the compose service)
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml up -d --wait postgres
      - '{{.PY}} -m pytest -m pgvector -q -rs'
    env:
      OBSLAB_REQUIRE_STACK: "1"

  test:ollama:
    desc: The RAG answers the sample questions with the real local models (needs Ollama)
    cmds: ['{{.PY}} -m pytest -m ollama -q -rs']
