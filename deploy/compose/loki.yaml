auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /tmp/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true   # required for OTLP ingestion (trace_id, attributes)
  volume_enabled: true
  retention_period: 72h             # same as the cluster (deploy/k8s/platform/values/loki.yaml)
compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true           # actually delete lines older than retention_period
  delete_request_store: filesystem
