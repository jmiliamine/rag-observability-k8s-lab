# Test harness, not a way to run the lab: the backends the end-to-end tests query, started in
# seconds on a developer machine and in CI. The lab itself runs on the cluster (deploy/k8s).
# No Grafana here: the tests read Prometheus, Tempo and Loki directly.
#   task test:compose    start it, index the sample notes, follow one question
#   task test:pgvector   only PostgreSQL
# Prometheus :9090 · Tempo :3200 · Loki :3100 · PostgreSQL :5432
# Every port is bound to 127.0.0.1: nothing here has authentication worth exposing on a network.
# App -> OTLP/HTTP localhost:4318 -> collector -> Prometheus (metrics), Tempo (traces), Loki (logs)
name: obslab

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP (the app uses this)
      - "127.0.0.1:8889:8889"     # Prometheus exporter (scraped by Prometheus)
      - "127.0.0.1:13133:13133"   # health check
    depends_on: [tempo, loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../shared/prometheus:/etc/prometheus/rules:ro     # same SLO rules as the k8s PrometheusRule
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports: ["127.0.0.1:3200:3200"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: obslab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OBSLAB_PG_ADMIN_PASSWORD:-postgres-local}
      OBSLAB_WRITER_PASSWORD: ${OBSLAB_WRITER_PASSWORD:-writer-local}
      OBSLAB_READER_PASSWORD: ${OBSLAB_READER_PASSWORD:-reader-local}
      OBSLAB_CHAT_PASSWORD: ${OBSLAB_CHAT_PASSWORD:-chat-local}
    volumes:
      - ../shared/postgres/init-obslab.sh:/docker-entrypoint-initdb.d/10-obslab.sh:ro
      - postgres-data:/var/lib/postgresql
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      # Over TCP on purpose: during the first start the image runs a temporary server on the
      # Unix socket only (for the init script), which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d obslab"]
      interval: 5s
      retries: 6
      start_period: 180s     # first start: initdb, the init script, then a restart
    restart: unless-stopped

volumes:
  prometheus-data:
  postgres-data:
