# GENERATED by scripts/gen_observability.py — do not edit, edit the generator or deploy/shared.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: obslab-rag-slo
  namespace: monitoring
spec:
  groups:
    - name: rag-sli
      rules:
        - record: rag:requests:rate5m
          expr: sum(rate(gen_ai_invoke_workflow_duration_seconds_count[5m]))
        - record: rag:errors:ratio5m
          expr: |
            # "or vector(0)": the error series only exists after the first error;
            # without it the ratio is empty (not 0) and the alert/panel shows "No data".
            (sum(rate(gen_ai_invoke_workflow_duration_seconds_count{error_type!=""}[5m])) or vector(0))
            / clamp_min(sum(rate(gen_ai_invoke_workflow_duration_seconds_count[5m])), 1e-9)
        - record: rag:latency:p95_5m
          expr: histogram_quantile(0.95, sum by (le) (rate(gen_ai_invoke_workflow_duration_seconds_bucket[5m])))
        - record: rag:ttfc:p95_5m
          expr: histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(gen_ai_client_operation_time_to_first_chunk_seconds_bucket[5m])))
        - record: rag:fallback:ratio15m
          expr: |
            (sum(increase(rag_fallbacks_total[15m])) or vector(0))
            / clamp_min(sum(increase(gen_ai_invoke_workflow_duration_seconds_count[15m])), 1e-9)
        - record: rag:groundedness:p50_15m
          expr: histogram_quantile(0.5, sum by (le) (rate(rag_answer_groundedness_bucket[15m])))
        - record: llm:tokens:rate5m
          expr: sum by (gen_ai_request_model) (rate(gen_ai_client_inference_usage_input_tokens_total[5m]) + rate(gen_ai_client_inference_usage_output_tokens_total[5m]))

    - name: rag-alerts
      rules:
        - alert: RagErrorRateHigh
          expr: rag:errors:ratio5m > 0.05 and rag:requests:rate5m > 0
          for: 5m
          labels: {severity: page}
          annotations:
            summary: "RAG error ratio {{ $value | humanizePercentage }} (SLO: < 5%)"
        - alert: RagLatencyP95High
          expr: rag:latency:p95_5m > 30
          for: 10m
          labels: {severity: ticket}
          annotations:
            summary: "RAG p95 latency {{ $value | humanizeDuration }} (SLO: < 30s locally)"
        - alert: RagFallbackRateHigh
          expr: rag:fallback:ratio15m > 0.3
          for: 15m
          labels: {severity: ticket}
          annotations:
            summary: "{{ $value | humanizePercentage }} of questions got I-don't-know (no relevant context, or the model declined) — index stale or threshold too strict?"
        - alert: RagGroundednessLow
          expr: rag:groundedness:p50_15m < 0.5
          for: 15m
          labels: {severity: ticket}
          annotations:
            summary: "Median groundedness {{ $value }} — answers drift away from retrieved context"
        # 96 s = 0.8 x the default request deadline (120 s). Silent when the series is absent.
        - alert: RagRequestStuck
          expr: max(rag_request_oldest_age_seconds) > 96
          for: 2m
          labels: {severity: ticket}
          annotations:
            summary: "A question has been running for {{ $value | humanizeDuration }}, close to the request deadline"
            runbook: "docs/troubleshooting.md, section A question is stuck"
        # Host alerts: silent when the host poller is not running (no series, no alert).
        - alert: HostGpuMemoryHigh
          expr: max(hw_gpu_memory_usage_bytes / hw_gpu_memory_limit_bytes) > 0.9
          for: 5m
          labels: {severity: ticket}
          annotations:
            summary: "GPU memory {{ $value | humanizePercentage }} used: the model may be pushed out of it"
            runbook: "docs/troubleshooting.md, section GPU memory is almost full"
        - alert: ModelPartlyOnCpu
          expr: sum(obslab_ollama_model_size_bytes - obslab_ollama_model_vram_bytes) > 0
          for: 5m
          labels: {severity: ticket}
          annotations:
            summary: "{{ $value | humanize1024 }}B of a loaded model run on the CPU: answers are much slower"
            runbook: "docs/troubleshooting.md, section GPU memory is almost full"
