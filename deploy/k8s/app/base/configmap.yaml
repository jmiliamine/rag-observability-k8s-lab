# Non-secret configuration (12-factor): the same image runs everywhere, only this changes.
# Secrets (an API key for a hosted model, for instance) go in a Secret, never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: obslab-config
data:
  OBSLAB_PROVIDER: ollama
  OBSLAB_CHAT_MODEL: llama3.2:3b
  OBSLAB_EMBED_MODEL: nomic-embed-text
  # ExternalName Service (see ollama.yaml), called by its FULL name on purpose: an ExternalName
  # does not rewrite the Host header, and Ollama rejects unknown hosts with 403 (DNS-rebinding
  # protection). It accepts *.local and *.internal, so "...svc.cluster.local" passes, "ollama" does not.
  OLLAMA_BASE_URL: http://ollama.obslab.svc.cluster.local:11434
  OBSLAB_TELEMETRY: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  OTEL_SERVICE_NAME: obslab-rag
  # Events also go to the container output, one JSON object per line: `kubectl logs` shows them
  # even when the collector or Loki is down. Nothing collects that output, so no line is doubled.
  OBSLAB_LOG_STDOUT: "true"
  OBSLAB_ENVIRONMENT: k3d
  # Vector store: PostgreSQL + pgvector in this namespace. Standard libpq variables; each workload
  # adds its own PGUSER/PGPASSWORD from the obslab-db Secret (reader for the API, writer for ingest).
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: obslab
  PGCONNECT_TIMEOUT: "3"
  OBSLAB_DB_TIMEOUT_MS: "5000"                               # statement timeout on vector queries
  # Admission in front of the model (rag/admission.py). One model call at a time per replica and a
  # short waiting line: beyond it a question is refused at once (503) instead of queueing unseen
  # inside the model server. Sizing: queue x typical answer time < deadline < the caller's timeout.
  # The deadline is an upper bound: a caller can announce a shorter one with X-Request-Timeout.
  # These limits are per replica (deployment.yaml).
  OBSLAB_MODEL_CONCURRENCY: "1"
  OBSLAB_MODEL_QUEUE: "8"
  OBSLAB_REQUEST_DEADLINE_S: "120"
  # Conversations: turns of history used to understand a follow-up, questions allowed in one
  # conversation, and days an idle conversation is kept before the purge job deletes it.
  OBSLAB_HISTORY_TURNS: "3"
  OBSLAB_MAX_TURNS: "20"
  OBSLAB_CONVERSATION_TTL_DAYS: "7"
  OBSLAB_TOP_K: "4"
  OBSLAB_MIN_SCORE: "0.6"                                      # calibrated for nomic-embed-text (fake overlay: 0.2)
  # API-equivalent cost, in USD per 1M tokens, at the list price of a small hosted model: the local
  # model is free, this shows what the same traffic would cost on an API.
  OBSLAB_PRICE_IN: "1"
  OBSLAB_PRICE_OUT: "5"
  OBSLAB_CAPTURE_CONTENT: "false"                              # prompts/answers stay off traces
  OTEL_SEMCONV_STABILITY_OPT_IN: http                          # stable HTTP metric names
