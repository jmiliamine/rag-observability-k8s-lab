# PostgreSQL + pgvector: the vector store of the RAG. Owned by the app team,
# like the rest of this namespace; a managed PostgreSQL with the pgvector extension replaces it
# as is (the app only needs the PG* connection variables).
#
# One replica on a local-path volume: enough for a lab. Credentials live in the Secret
# `obslab-db`, generated by `task db:secret` (never in git):
#   admin-password   the postgres superuser, used only by the first-start script
#   writer-password  obslab_writer, the ingest job
#   reader-password  obslab_reader, the API (SELECT only, read-only transactions)
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30      # time for a clean shutdown checkpoint
      # UID/GID 999 = the `postgres` user of the official image: runs under the restricted profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: obslab}
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: obslab-db, key: admin-password}}
            - name: OBSLAB_WRITER_PASSWORD
              valueFrom: {secretKeyRef: {name: obslab-db, key: writer-password}}
            - name: OBSLAB_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: obslab-db, key: reader-password}}
            - name: OBSLAB_CHAT_PASSWORD
              valueFrom: {secretKeyRef: {name: obslab-db, key: chat-password}}
          # A few thousand chunks: shared_buffers stays at its default, memory is mostly page cache.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          # Probes go through TCP: during the first start the image runs a temporary server on
          # the Unix socket only (for the init script), which must not count as ready.
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, obslab]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, obslab]}
            initialDelaySeconds: 30          # the first start runs initdb and the init script
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # writes go to the data volume, the socket dir and /tmp
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}      # PG 18 keeps PGDATA in a subdirectory
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: run
          emptyDir: {sizeLimit: 8Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}
---
# Only the API and the ingest job may open a connection to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [obslab-api, obslab-ingest, obslab-purge]}
      ports:
        - port: 5432
