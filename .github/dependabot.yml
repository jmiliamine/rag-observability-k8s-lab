# Version and security updates as pull requests, so pinned does not mean stale.
# Each PR runs the full CI, including the image and dependency scans.
#
# Not covered here, bump by hand: the Helm chart versions and the scanner image digests in
# Taskfile.yml, the k3s image in deploy/k8s/k3d.yaml, and the Ollama image in
# .github/workflows/real-model.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}       # let a new release settle before adopting it
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: uv             # pyproject.toml + uv.lock
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker         # base image and uv image in the Dockerfile
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    # One pull request per image: the end-to-end job then says which upgrade breaks the stack.
    # No major version from here: a major of Prometheus, Tempo, Loki or Grafana changes
    # configuration and is done by hand, with its release notes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker         # images referenced by the Kubernetes manifests
    directory: /deploy/k8s/app/base
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
