# Version and security updates as pull requests, so pinned does not mean stale.
# Each PR runs the full CI, including the image and dependency scans.
#
# Not covered here, bump by hand: the Helm chart versions and the scanner image digests in
# Taskfile.yml, the k3s image in deploy/k8s/k3d.yaml, the Ollama image in
# .github/workflows/real-model.yml, and the Collector image in deploy/compose (see below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}       # let a new release settle before adopting it
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: uv             # pyproject.toml + uv.lock
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker         # base image and uv image in the Dockerfile
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    # One pull request for all the images: main requires an up-to-date branch, so one pull request
    # per image means one rebase and one CI run each. If the group fails, the end-to-end job log
    # names the container that did not start.
    groups:
      compose-images: {patterns: ["*"]}
    # No major version from here: a major of Prometheus, Tempo, Loki or Grafana changes
    # configuration and is done by hand, with its release notes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Collector publishes one tag per architecture (0.163.2-386, -arm64...). Dependabot reads
      # the suffix as a newer version and proposed the 32-bit build three times. Bumped by hand,
      # with the Collector chart of the cluster (Taskfile.yml).
      - dependency-name: "otel/opentelemetry-collector-contrib"

  - package-ecosystem: docker         # images referenced by the Kubernetes manifests
    directory: /deploy/k8s/app/base
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
