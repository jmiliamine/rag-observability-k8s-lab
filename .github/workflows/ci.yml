# Every job runs the same Task commands as a developer machine.
#
# Supply chain: actions are pinned to a commit SHA (a tag can be moved, a SHA cannot), tools to an
# exact version, scanner images to a digest (Taskfile.yml). Dependabot proposes the bumps
# (.github/dependabot.yml), so staying pinned does not mean staying old.
#
# Permissions: none by default, read-only on the code per job. No job needs a secret; the
# workflow never runs on `pull_request_target`, so a pull request from a fork cannot reach one.
#
# The cluster job (k3d, the whole platform) runs on main, weekly, on demand, and on pull requests
# labelled `cluster-e2e`: see the job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"      # Mondays: new CVEs and upstream image changes show up without a push
  workflow_dispatch:

permissions: {}

concurrency:
  # One group per pull request: a newer push replaces its run. One group per commit elsewhere:
  # a group keeps one waiting run only, so two merges a minute apart on a shared `main` group
  # would cancel the first one's run before it starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"              # `uv sync` fails if uv.lock does not match pyproject.toml
  UV_VERSION: "0.12.21"
  TASK_VERSION: "3.53.1"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: lint + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - run: task setup
      - run: task lint             # ruff, generated files in sync, Kustomize overlays render
      - run: task test             # offline: outbound network blocked

  pgvector:
    name: pgvector store and guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          save-cache: false        # the test job saves the same uv cache; one writer is enough
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - run: task setup
      - run: task test:pgvector    # starts the Compose PostgreSQL service, fails if it is not reachable

  compose-e2e:
    name: compose end to end (telemetry of one question)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          save-cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - run: task setup
      # Starts Prometheus, Tempo, Loki, Grafana, the collector and PostgreSQL, indexes the sample
      # notes, asks one question and checks that its metrics, trace and logs arrived.
      - run: task test:compose
      - name: container logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 80

  security:
    name: security scans (workflows, secrets, dependencies, manifests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0           # gitleaks scans every commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          save-cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - run: task setup
      - run: task scan:workflows   # actionlint + zizmor on this file
      - run: task scan:secrets     # gitleaks, full history
      - run: task scan:deps        # known vulnerabilities in uv.lock
      - run: task scan:config      # Dockerfile, Compose, rendered Kubernetes manifests

  image:
    name: image build + vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          save-cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - run: task setup
      - run: task scan:image       # builds from uv.lock, fails on a fixable HIGH or CRITICAL

  cluster:
    name: cluster end to end (k3d, fake models)
    # The whole lab on a real cluster: `task up`, then the same suites a developer runs. Heavier
    # than the other jobs, so not on every push of a pull request: it runs on main, on the weekly
    # schedule, on demand, and on a pull request that carries the `cluster-e2e` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'cluster-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0   # k3d-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          save-cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e   # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ github.token }}
      - name: Free disk space
        # The runner image ships toolchains this job never uses, and leaves about 14 GB free:
        # not enough for the node images. Above 85% the kubelet reports disk pressure and Loki
        # stops accepting logs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install k3d (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  $RUNNER_TEMP/k3d" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version && kubectl version --client && helm version --short
      - run: task setup
      - run: task up OVERLAY=fake
      - run: task test:k8s         # through the Gateway: both replicas, conversations, data lake, SLO rules
      - run: task test:stack       # one question's metrics, trace and logs in the cluster's backends
      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          kubectl -n obslab logs deploy/obslab-api --tail=80 --all-containers || true
          kubectl -n observability logs deploy/otel-collector --tail=80 || true
          kubectl -n observability logs statefulset/loki --tail=400 | grep -v 'component=querier\|component=frontend' | tail -n 60 || true
          df -h / || true
